<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">Скорость видео</span>
      <span id="speed-badge" class="badge">1.0x</span>
    </div>
    <div class="buttons-grid">
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn" data-speed="0.7">0.7x</button>
      <button class="speed-btn" data-speed="1">1.0x</button>
      <button class="speed-btn" data-speed="1.2">1.2x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="1.7">1.7x</button>
      <button class="speed-btn" data-speed="2">2.0x</button>
      <button class="speed-btn" data-speed="2.5">2.5x</button>
    </div>
    <div class="footer">
      <span id="ext-version"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
