<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">Скорость видео</span>
      <div class="header-right">
        <span id="speed-badge" class="badge">1.0x</span>
        <button id="toggle-settings" class="settings-btn" title="Настройки горячих клавиш">⚙</button>
      </div>
    </div>
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-title">Горячие клавиши</div>
      <div class="hotkey-row">
        <span class="hotkey-label">Ускорить (+0.1x)</span>
        <button id="hotkey-speedUp" class="hotkey-btn" data-action="speedUp">Alt + ↑</button>
      </div>
      <div class="hotkey-row">
        <span class="hotkey-label">Замедлить (−0.1x)</span>
        <button id="hotkey-speedDown" class="hotkey-btn" data-action="speedDown">Alt + ↓</button>
      </div>
      <div class="hotkey-row">
        <span class="hotkey-label">Сброс (1.0x)</span>
        <button id="hotkey-reset" class="hotkey-btn" data-action="reset">Alt + R</button>
      </div>
      <div class="hotkey-row">
        <span class="hotkey-label">Картинка в картинке</span>
        <button id="hotkey-pip" class="hotkey-btn" data-action="pip">Alt + P</button>
      </div>
      <button id="reset-hotkeys" class="reset-hotkeys-btn">Сбросить клавиши</button>
    </div>
    <div class="fine-tuning-panel">
      <button id="step-down" class="fine-btn">−0.1</button>
      <button id="reset-speed" class="fine-btn">1.0x</button>
      <button id="step-up" class="fine-btn">+0.1</button>
    </div>
    <div class="buttons-grid">
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn" data-speed="0.7">0.7x</button>
      <button class="speed-btn" data-speed="1">1.0x</button>
      <button class="speed-btn" data-speed="1.2">1.2x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="1.7">1.7x</button>
      <button class="speed-btn" data-speed="2">2.0x</button>
      <button class="speed-btn" data-speed="2.5">2.5x</button>
    </div>
    <button id="toggle-pip" class="pip-action-btn" title="Картинка в картинке (Alt + P)">
      <svg class="pip-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="3" ry="3"></rect>
        <rect x="12" y="10" width="8" height="8" rx="1.5" ry="1.5" fill="currentColor" fill-opacity="0.3"></rect>
      </svg>
      <span>Картинка в картинке</span>
    </button>
    <div class="footer">
      <span id="ext-version"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
